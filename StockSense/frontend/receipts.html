<!DOCTYPE html>
<html>
<head>
    <title>StockSense Receipts</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="sidebar">
    <h2>StockSense</h2>

    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="receipts.html">Receipts</a>
    <a href="deliveries.html">Deliveries</a>
    <a href="transfers.html">Transfers</a>
    <a href="adjustments.html">Adjustments</a>
    <a href="warehouses.html">Warehouses</a>
</div>

<div class="main">

    <h1>Incoming Receipts</h1>
    <p>Receive goods from suppliers and automatically increase stock.</p>

    <div class="card">

        <h2>New Receipt</h2>

        <form id="receiptForm">

            <input
                id="supplier"
                type="text"
                placeholder="Supplier Name"
                required
            >

            <select id="location" required>
                <option value="">Select Location</option>
            </select>

            <select id="product" required>
                <option value="">Select Product</option>
            </select>

            <input
                id="quantity"
                type="number"
                min="1"
                placeholder="Quantity"
                required
            >

            <button type="submit">
                Receive Stock
            </button>

        </form>

        <p id="message"></p>

    </div>

    <div class="card">

        <h2>Receipt History</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Supplier</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody id="receiptTable"></tbody>
        </table>

    </div>

</div>

<script>

const API = "http://127.0.0.1:5000";


async function loadProducts() {

    const response = await fetch(API + "/api/products");
    const data = await response.json();

    const select = document.getElementById("product");

    data.products.forEach(product => {

        const option = document.createElement("option");

        option.value = product.id;
        option.textContent =
            product.name + " (" + product.sku + ")";

        select.appendChild(option);
    });
}


async function loadLocations() {

    const response = await fetch(API + "/api/warehouses");
    const data = await response.json();

    const select = document.getElementById("location");

    for (const warehouse of data.warehouses) {

        const locationResponse = await fetch(
            API + "/api/warehouses/" +
            warehouse.id +
            "/locations"
        );

        const locationData = await locationResponse.json();

        locationData.locations.forEach(location => {

            const option = document.createElement("option");

            option.value = location.id;

            option.textContent =
                warehouse.name + " - " + location.name;

            select.appendChild(option);
        });
    }
}


async function loadReceipts() {

    const response = await fetch(API + "/api/receipts");
    const data = await response.json();

    const table = document.getElementById("receiptTable");

    table.innerHTML = "";

    data.receipts.forEach(receipt => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${receipt.id}</td>
            <td>${receipt.supplier}</td>
            <td>${receipt.status}</td>
            <td>${receipt.created_at}</td>
        `;

        table.appendChild(row);
    });
}


document.getElementById("receiptForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const data = {

            supplier:
                document.getElementById("supplier").value,

            location_id:
                Number(document.getElementById("location").value),

            items: [
                {
                    product_id:
                        Number(document.getElementById("product").value),

                    quantity:
                        Number(document.getElementById("quantity").value)
                }
            ]
        };

        const response = await fetch(
            API + "/api/receipts",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );

        const result = await response.json();

        document.getElementById("message").textContent =
            result.message;

        if (response.ok) {

            document.getElementById("receiptForm").reset();

            loadReceipts();
        }
    }
);


loadProducts();
loadLocations();
loadReceipts();

</script>

</body>
</html>
